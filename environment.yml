# conda env create -f environment.yml && conda activate mashID && pip install .
name: mashID
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10
  - mash=2.3      # if mash fails with "libgsl.so.25: cannot open shared object", an old build (_9) was
                  # picked: use mash=2.3=*_11 (or newer), which links against gsl 2.8
  - python-isal   # optional: faster gzip decompression when counting reads
  - pip
