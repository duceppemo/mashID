[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mashID"
# Static on purpose: a dynamic `attr = "mashid.__version__"` makes setuptools look for `mashid.py`, which on
# case-insensitive filesystems (macOS) resolves to the legacy `mashID.py` wrapper. tests/test_version.py
# keeps this in sync with mashid.__version__.
version = "0.2.5"
description = "Identify organisms from genome assemblies (fasta) or raw reads (fastq) using Mash."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Marc-Olivier Duceppe" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
fast = ["isal>=1.0"]      # faster gzip decompression when counting reads
test = ["pytest>=7", "ruff", "pre-commit"]

[project.urls]
Homepage = "https://github.com/duceppemo/mashID"

[project.scripts]
mashID = "mashid.cli:main"
make_mashID_db = "mashid.makedb:main"
mashID_download_db = "mashid.download_cli:main"

[tool.setuptools]
packages = ["mashid"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 115
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
