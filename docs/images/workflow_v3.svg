<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7a"/>
    </marker>
  </defs>
  <style>
    .box { fill: #eef3f8; stroke: #5b6b7a; stroke-width: 1.5; rx: 10; }
    .db  { fill: #e6f4ea; stroke: #3c8d5a; stroke-width: 1.5; rx: 10; }
    .out { fill: #fff4e0; stroke: #c98a1b; stroke-width: 1.5; rx: 10; }
    .t   { fill: #1f2933; font-size: 17px; font-weight: 600; }
    .s   { fill: #3e4c59; font-size: 14px; }
    .l   { stroke: #5b6b7a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>

  <rect class="box" x="20" y="10" width="380" height="66"/>
  <text class="t" x="210" y="36" text-anchor="middle">Input files</text>
  <text class="s" x="210" y="58" text-anchor="middle">fastq or fasta, gzipped or not, grouped into samples</text>

  <line class="l" x1="210" y1="76" x2="210" y2="98"/>

  <rect class="box" x="20" y="100" width="380" height="66"/>
  <text class="t" x="210" y="126" text-anchor="middle">Count reads</text>
  <text class="s" x="210" y="148" text-anchor="middle">sequences and bases (--max-reads: a subset only)</text>

  <line class="l" x1="210" y1="166" x2="210" y2="188"/>

  <rect class="box" x="20" y="190" width="380" height="66"/>
  <text class="t" x="210" y="216" text-anchor="middle">mash screen -w</text>
  <text class="s" x="210" y="238" text-anchor="middle">containment of every reference in the sample</text>

  <rect class="db" x="440" y="190" width="300" height="66"/>
  <text class="t" x="590" y="216" text-anchor="middle">Database .msh</text>
  <text class="s" x="590" y="238" text-anchor="middle">+ metadata: names, TaxIDs, lengths</text>
  <line class="l" x1="440" y1="223" x2="402" y2="223"/>

  <line class="l" x1="210" y1="256" x2="210" y2="278"/>

  <rect class="box" x="20" y="280" width="380" height="86"/>
  <text class="t" x="210" y="306" text-anchor="middle">Filter, rank, annotate</text>
  <text class="s" x="210" y="328" text-anchor="middle">drop partial references, name from metadata,</text>
  <text class="s" x="210" y="348" text-anchor="middle">flag mixtures, ambiguity and low depth</text>

  <line class="l" x1="210" y1="366" x2="210" y2="388"/>

  <rect class="out" x="20" y="390" width="380" height="66"/>
  <text class="t" x="210" y="416" text-anchor="middle">Outputs</text>
  <text class="s" x="210" y="438" text-anchor="middle">summary TSV, JSON, MultiQC, per-sample tables, run info</text>
</svg>
