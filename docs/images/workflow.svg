<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7a"/>
    </marker>
  </defs>
  <style>
    .box { fill: #eef3f8; stroke: #5b6b7a; stroke-width: 1.5; rx: 8; }
    .db  { fill: #e6f4ea; stroke: #3c8d5a; stroke-width: 1.5; rx: 8; }
    .out { fill: #fff4e0; stroke: #c98a1b; stroke-width: 1.5; rx: 8; }
    .t   { fill: #1f2933; }
    .s   { fill: #5b6b7a; font-size: 12px; }
    .l   { stroke: #5b6b7a; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>
  <rect class="box" x="10" y="60" width="150" height="80"/>
  <text class="t" x="85" y="88" text-anchor="middle" font-weight="600">Input files</text>
  <text class="s" x="85" y="108" text-anchor="middle">fastq / fasta, gzipped</text>
  <text class="s" x="85" y="124" text-anchor="middle">grouped into samples</text>

  <line class="l" x1="160" y1="100" x2="200" y2="100"/>

  <rect class="box" x="200" y="60" width="170" height="80"/>
  <text class="t" x="285" y="88" text-anchor="middle" font-weight="600">Count reads</text>
  <text class="s" x="285" y="108" text-anchor="middle">sequences, bases</text>
  <text class="s" x="285" y="124" text-anchor="middle">(--max-reads streams a subset)</text>

  <line class="l" x1="370" y1="100" x2="410" y2="100"/>

  <rect class="box" x="410" y="60" width="170" height="80"/>
  <text class="t" x="495" y="88" text-anchor="middle" font-weight="600">mash screen -w</text>
  <text class="s" x="495" y="108" text-anchor="middle">containment of each</text>
  <text class="s" x="495" y="124" text-anchor="middle">reference in the sample</text>

  <rect class="db" x="410" y="150" width="170" height="40"/>
  <text class="t" x="495" y="169" text-anchor="middle" font-weight="600">Database .msh</text>
  <text class="s" x="495" y="184" text-anchor="middle">+ metadata sidecar (names, TaxIDs, lengths)</text>
  <line class="l" x1="495" y1="150" x2="495" y2="142"/>

  <line class="l" x1="580" y1="100" x2="620" y2="100"/>

  <rect class="box" x="620" y="60" width="150" height="80"/>
  <text class="t" x="695" y="82" text-anchor="middle" font-weight="600">Filter, rank, annotate</text>
  <text class="s" x="695" y="100" text-anchor="middle">drop partial references</text>
  <text class="s" x="695" y="115" text-anchor="middle">name from metadata</text>
  <text class="s" x="695" y="130" text-anchor="middle">mixture / ambiguity / depth</text>

  <line class="l" x1="770" y1="100" x2="810" y2="100"/>

  <rect class="out" x="810" y="45" width="80" height="110"/>
  <text class="t" x="850" y="70" text-anchor="middle" font-weight="600">Outputs</text>
  <text class="s" x="850" y="90" text-anchor="middle">summary TSV</text>
  <text class="s" x="850" y="105" text-anchor="middle">JSON</text>
  <text class="s" x="850" y="120" text-anchor="middle">MultiQC</text>
  <text class="s" x="850" y="135" text-anchor="middle">per-sample</text>
  <text class="s" x="850" y="150" text-anchor="middle">run info</text>
</svg>
