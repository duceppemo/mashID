<svg xmlns="http://www.w3.org/2000/svg" width="980" height="210" viewBox="0 0 980 210" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7a"/>
    </marker>
  </defs>
  <style>
    .box { fill: #eef3f8; stroke: #5b6b7a; stroke-width: 1.5; rx: 8; }
    .db  { fill: #e6f4ea; stroke: #3c8d5a; stroke-width: 1.5; rx: 8; }
    .out { fill: #fff4e0; stroke: #c98a1b; stroke-width: 1.5; rx: 8; }
    .t   { fill: #1f2933; }
    .s   { fill: #5b6b7a; font-size: 12px; }
    .l   { stroke: #5b6b7a; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>

  <rect class="box" x="10" y="50" width="150" height="80"/>
  <text class="t" x="85" y="78" text-anchor="middle" font-weight="600">Input files</text>
  <text class="s" x="85" y="98" text-anchor="middle">fastq / fasta, gzipped</text>
  <text class="s" x="85" y="114" text-anchor="middle">grouped into samples</text>

  <line class="l" x1="160" y1="90" x2="200" y2="90"/>

  <rect class="box" x="200" y="50" width="180" height="80"/>
  <text class="t" x="290" y="78" text-anchor="middle" font-weight="600">Count reads</text>
  <text class="s" x="290" y="98" text-anchor="middle">sequences, bases</text>
  <text class="s" x="290" y="114" text-anchor="middle">--max-reads: subset only</text>

  <line class="l" x1="380" y1="90" x2="420" y2="90"/>

  <rect class="box" x="420" y="50" width="180" height="80"/>
  <text class="t" x="510" y="78" text-anchor="middle" font-weight="600">mash screen -w</text>
  <text class="s" x="510" y="98" text-anchor="middle">containment of each</text>
  <text class="s" x="510" y="114" text-anchor="middle">reference in the sample</text>

  <line class="l" x1="510" y1="152" x2="510" y2="140"/>
  <rect class="db" x="375" y="152" width="270" height="52"/>
  <text class="t" x="510" y="171" text-anchor="middle" font-weight="600">Database .msh</text>
  <text class="s" x="510" y="188" text-anchor="middle">+ metadata sidecar: names, TaxIDs, lengths</text>

  <line class="l" x1="600" y1="90" x2="640" y2="90"/>

  <rect class="box" x="640" y="50" width="190" height="80"/>
  <text class="t" x="735" y="72" text-anchor="middle" font-weight="600">Filter, rank, annotate</text>
  <text class="s" x="735" y="90" text-anchor="middle">drop partial references</text>
  <text class="s" x="735" y="105" text-anchor="middle">name from metadata</text>
  <text class="s" x="735" y="120" text-anchor="middle">mixture / ambiguity / depth</text>

  <line class="l" x1="830" y1="90" x2="870" y2="90"/>

  <rect class="out" x="870" y="35" width="100" height="110"/>
  <text class="t" x="920" y="60" text-anchor="middle" font-weight="600">Outputs</text>
  <text class="s" x="920" y="80" text-anchor="middle">summary TSV</text>
  <text class="s" x="920" y="95" text-anchor="middle">JSON</text>
  <text class="s" x="920" y="110" text-anchor="middle">MultiQC</text>
  <text class="s" x="920" y="125" text-anchor="middle">per-sample</text>
  <text class="s" x="920" y="140" text-anchor="middle">run info</text>
</svg>
