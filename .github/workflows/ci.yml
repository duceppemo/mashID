name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          create-args: python=${{ matrix.python-version }}
          cache-environment: true
      - name: Install mashID
        run: pip install -e ".[test]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -v --cov=mashid --cov-report=term --cov-report=xml
      # Upload once. Dependabot pull requests cannot read the CODECOV_TOKEN secret, so they skip the upload.
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && github.actor != 'dependabot[bot]'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          # Strict on pushes, to notice a broken Codecov setup; a Codecov hiccup should not fail a pull request.
          fail_ci_if_error: ${{ github.event_name == 'push' && secrets.CODECOV_TOKEN != '' }}
      - name: Smoke test CLIs
        run: |
          mashID --version
          make_mashID_db --version
          mashID_download_db
