name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          create-args: python=${{ matrix.python-version }}
          cache-environment: true
      - name: Install mashID
        run: pip install -e ".[test]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -v
      - name: Smoke test CLIs
        run: |
          mashID --version
          make_mashID_db --version
          mashID_download_db
